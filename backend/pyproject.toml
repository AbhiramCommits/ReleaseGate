[project]
name = "releasegate-backend"
version = "0.1.0"
description = "ReleaseGate backend API (FastAPI + Strawberry GraphQL + SQLAlchemy)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "gunicorn>=21.2,<24",
    "strawberry-graphql[fastapi]>=0.235,<1",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg2-binary>=2.9.9,<3",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py", "app/export_schema.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
exclude = "tests/"

[[tool.mypy.overrides]]
module = "app.graphql.*"
disable_error_code = ["valid-type", "arg-type", "return-value", "attr-defined"]
