type ApprovalType {
  id: ID!
  stage: ChangeStage!
  decision: Decision!
  comment: String
  decidedAt: DateTime!
  reviewer: UserType!
}

type AuditEventType {
  id: ID!
  fromStage: ChangeStage
  toStage: ChangeStage
  action: String!
  createdAt: DateTime!
  metadata: JSON!
  actor: UserType!
}

type ChangeRequestConnection {
  edges: [ChangeRequestEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ChangeRequestEdge {
  cursor: String!
  node: ChangeRequestType!
}

input ChangeRequestInput {
  title: String!
  description: String!
  vehicleProgram: String!
  subsystem: String!
  riskLevel: RiskLevel!
}

type ChangeRequestType {
  id: ID!
  ticketKey: String!
  title: String!
  description: String!
  vehicleProgram: String!
  subsystem: String!
  riskLevel: RiskLevel!
  currentStage: ChangeStage!
  requesterId: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  requester: UserType!
  approvals: [ApprovalType!]!
  auditEvents: [AuditEventType!]!
}

input ChangeRequestUpdateInput {
  title: String = null
  description: String = null
  vehicleProgram: String = null
  subsystem: String = null
  riskLevel: RiskLevel = null
}

enum ChangeStage {
  DRAFT
  SUBMITTED
  ENGINEERING_REVIEW
  MANUFACTURING_REVIEW
  APPROVED
  REJECTED
}

type CycleTimeAnalytics {
  stageMetrics: [StageMetric!]!
  currentStageCounts: [StageCount!]!
  endToEndAverageHours: Float
  topSlowestStages: [StageMetric!]!
}

"""Date with time (isoformat)"""
scalar DateTime

enum Decision {
  APPROVE
  REJECT
  REQUEST_CHANGES
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type Mutation {
  createChangeRequest(input: ChangeRequestInput!): ChangeRequestType!
  updateChangeRequest(id: ID!, input: ChangeRequestUpdateInput!): ChangeRequestType!
  transitionChangeRequest(id: ID!, action: WorkflowAction!, comment: String = null): ChangeRequestType!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Query {
  me: UserType!
  changeRequest(id: ID!): ChangeRequestType
  changeRequests(stage: ChangeStage = null, riskLevel: RiskLevel = null, subsystem: String = null, first: Int = null, after: String = null): ChangeRequestConnection!
  cycleTimeAnalytics: CycleTimeAnalytics!
}

enum RiskLevel {
  LOW
  MEDIUM
  HIGH
}

enum Role {
  REQUESTER
  REVIEWER
  ADMIN
}

type StageCount {
  stage: ChangeStage!
  count: Int!
}

type StageMetric {
  stage: ChangeStage!
  averageHours: Float
  medianHours: Float
  samples: Int!
}

type UserType {
  id: ID!
  email: String!
  fullName: String!
  role: Role!
  createdAt: DateTime!
}

enum WorkflowAction {
  SUBMIT
  APPROVE
  REQUEST_CHANGES
  REJECT
}
